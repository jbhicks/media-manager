<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00FFFF" stroke-width="1" opacity="0.3"/>
    </pattern>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF00FF"/>
      <stop offset="100%" stop-color="#00FFFF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded rectangle background for professional feel -->
  <rect x="16" y="16" width="480" height="480" rx="90" ry="90" fill="#0A001F" />
  
  <!-- Clipping the grid to the rounded background -->
  <clipPath id="roundPatch">
    <rect x="16" y="16" width="480" height="480" rx="90" ry="90" />
  </clipPath>
  
  <rect x="16" y="16" width="480" height="480" fill="url(#grid)" clip-path="url(#roundPatch)" />

  <!-- Main MM with glow -->
  <g filter="url(#glow)">
     <text x="256" y="310" font-family="Arial Black, sans-serif" font-size="220" fill="url(#neonGrad)" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" opacity="0.9">MM</text>
  </g>
</svg>
