<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Suggestions Manager</title>
    <link rel="icon" type="image/svg+xml" href="/web/images/logo.svg">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .nav {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .nav a {
            background: #3d3d3d;
            color: #e0e0e0;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .nav a:hover {
            background: #4d4d4d;
        }

        .nav a.active {
            background: #4a9eff;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }

        .stat-card {
            background: #3d3d3d;
            padding: 15px;
            border-radius: 6px;
            flex: 1;
        }

        .stat-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            margin-top: 5px;
        }

        .controls {
            background: #2d2d2d;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        button {
            background: #4a9eff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        button:hover {
            background: #3a8eef;
        }

        button.secondary {
            background: #555;
        }

        button.secondary:hover {
            background: #666;
        }

        button.danger {
            background: #e74c3c;
        }

        button.danger:hover {
            background: #c0392b;
        }

        button.success {
            background: #27ae60;
        }

        button.success:hover {
            background: #229954;
        }

        button:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }

        select {
            background: #3d3d3d;
            color: #e0e0e0;
            border: 1px solid #555;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
        }

        .suggestions-list {
            display: grid;
            gap: 15px;
        }

        .suggestion-card {
            background: #2d2d2d;
            border: 2px solid #3d3d3d;
            border-radius: 8px;
            padding: 15px;
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 15px;
            align-items: center;
            transition: border-color 0.2s;
        }

        .suggestion-card:hover {
            border-color: #4a9eff;
        }

        .suggestion-card.selected {
            border-color: #4a9eff;
            background: #333;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .suggestion-info {
            flex: 1;
        }

        .suggestion-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #fff;
        }

        .suggestion-meta {
            display: flex;
            gap: 15px;
            font-size: 13px;
            color: #999;
            flex-wrap: wrap;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .meta-label {
            color: #666;
        }

        .meta-value {
            color: #e0e0e0;
            font-weight: 500;
        }

        .seeders {
            color: #27ae60;
            font-weight: 600;
        }

        .size {
            color: #4a9eff;
        }

        .suggestion-actions {
            display: flex;
            gap: 10px;
        }

        .suggestion-actions button {
            padding: 8px 16px;
            font-size: 13px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: #2d2d2d;
            border-radius: 8px;
        }

        .empty-state h2 {
            color: #999;
            margin-bottom: 10px;
        }

        .batch-actions {
            display: flex;
            gap: 10px;
        }

        .filter-group {
            margin-left: auto;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .search-bar input {
            flex: 1;
            background: #3d3d3d;
            color: #e0e0e0;
            border: 1px solid #555;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
        }

        .sort-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #2d2d2d;
            border-radius: 8px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #3d3d3d;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 20px;
        }

        .close-modal {
            background: #555;
            font-size: 24px;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
        }

        .modal-section {
            margin-bottom: 20px;
        }

        .modal-section h3 {
            font-size: 14px;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .modal-section p {
            margin: 5px 0;
            font-size: 14px;
        }

        .modal-section a {
            color: #4a9eff;
            text-decoration: none;
            word-break: break-all;
        }

        .modal-section a:hover {
            text-decoration: underline;
        }

        .quality-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 8px;
        }

        .quality-excellent {
            background: #27ae60;
            color: white;
        }

        .quality-good {
            background: #4a9eff;
            color: white;
        }

        .quality-fair {
            background: #f39c12;
            color: white;
        }

        .quality-poor {
            background: #e74c3c;
            color: white;
        }

        .recommendations-section {
            background: #2d2d2d;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .recommendations-section h2 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #4a9eff;
        }

        .recommendation-item {
            padding: 10px;
            background: #3d3d3d;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .recommendation-item:last-child {
            margin-bottom: 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Download Suggestions Manager</h1>
            <div class="nav">
                <a href="/web/suggestions.html" class="active">Suggestions</a>
                <a href="/downloads">Downloads</a>
            </div>
            <div class="stats" id="stats">
                <div class="stat-card">
                    <div class="stat-label">Pending</div>
                    <div class="stat-value" id="stat-pending">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Approved</div>
                    <div class="stat-value" id="stat-approved">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Rejected</div>
                    <div class="stat-value" id="stat-rejected">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total</div>
                    <div class="stat-value" id="stat-total">0</div>
                </div>
            </div>
        </header>

        <div class="controls">
            <button onclick="generateSuggestions()" class="success">
                Generate Suggestions
            </button>
            <div class="batch-actions">
                <button onclick="bulkApprove()" class="success" id="bulk-approve" disabled>
                    Approve Selected
                </button>
                <button onclick="bulkReject()" class="danger" id="bulk-reject" disabled>
                    Reject Selected
                </button>
            </div>
            <div class="filter-group">
                <select id="status-filter" onchange="saveFilterState(); loadSuggestions()">
                    <option value="">All</option>
                    <option value="pending">Pending</option>
                    <option value="approved">Approved</option>
                    <option value="rejected">Rejected</option>
                </select>
                <button onclick="clearRejected()" class="danger">
                    Clear Rejected
                </button>
                <button onclick="loadSuggestions()" class="secondary">
                    Refresh
                </button>
            </div>
        </div>

        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search suggestions by title..."
                onkeyup="handleSearchKeyup(event)">
            <button onclick="searchSuggestions()" class="secondary">Search</button>
            <div class="sort-controls">
                <select id="sort-by" onchange="searchSuggestions()">
                    <option value="seeders">Sort by Seeders</option>
                    <option value="size">Sort by Size</option>
                    <option value="upload_date">Sort by Upload Date</option>
                    <option value="quality_score">Sort by Quality</option>
                </select>
                <input type="number" id="min-seeders" placeholder="Min Seeders" min="0" style="width: 120px;">
            </div>
        </div>

        <div id="recommendations-container"></div>

        <div id="suggestions-container">
            <div class="loading">Loading suggestions...</div>
        </div>

        <div class="pagination" id="pagination"></div>
    </div>

    <div id="detail-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Torrent Details</h2>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-section">
                <h3>Title</h3>
                <p id="modal-detail-title"></p>
            </div>
            <div class="modal-section">
                <h3>Info</h3>
                <p><strong>Seeders:</strong> <span id="modal-seeders"></span></p>
                <p><strong>Leechers:</strong> <span id="modal-leechers"></span></p>
                <p><strong>Size:</strong> <span id="modal-size"></span></p>
                <p><strong>Upload Date:</strong> <span id="modal-upload-date"></span></p>
                <p><strong>Category:</strong> <span id="modal-category"></span></p>
                <p><strong>Quality:</strong> <span id="modal-quality"></span></p>
                <p><strong>Resolution:</strong> <span id="modal-resolution"></span></p>
                <p><strong>Quality Score:</strong> <span id="modal-quality-score"></span></p>
            </div>
            <div class="modal-section">
                <h3>Magnet Link</h3>
                <p><a href="#" id="modal-magnet-link" target="_blank">Click to copy</a></p>
            </div>
            <div class="modal-section">
                <h3>Info Hash</h3>
                <p id="modal-info-hash"></p>
            </div>
            <div class="modal-section" id="modal-notes-section" style="display: none;">
                <h3>Notes</h3>
                <p id="modal-notes"></p>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="approveFromModal()" class="success" id="modal-approve-btn">Approve</button>
                <button onclick="rejectFromModal()" class="danger" id="modal-reject-btn">Reject</button>
                <button onclick="closeModal()" class="secondary">Close</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin + '/api';
        let selectedIds = new Set();
        let currentPage = 0;
        const pageSize = 20;
        let currentModalId = null;

        // Load filter state from localStorage
        function loadFilterState() {
            const savedFilter = localStorage.getItem('suggestions-status-filter');
            if (savedFilter !== null) {
                document.getElementById('status-filter').value = savedFilter;
            }
        }

        // Save filter state to localStorage
        function saveFilterState() {
            const filter = document.getElementById('status-filter').value;
            localStorage.setItem('suggestions-status-filter', filter);
        }

        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/suggestions/stats`);
                const stats = await response.json();
                document.getElementById('stat-pending').textContent = stats.pending || 0;
                document.getElementById('stat-approved').textContent = stats.approved || 0;
                document.getElementById('stat-rejected').textContent = stats.rejected || 0;
                document.getElementById('stat-total').textContent = stats.total || 0;
            } catch (error) {
                console.error('Failed to load stats:', error);
            }
        }

        async function loadRecommendations() {
            try {
                const response = await fetch(`${API_BASE}/suggestions/recommendations?limit=5`);
                const data = await response.json();

                if (data.recommendations && data.recommendations.length > 0) {
                    const container = document.getElementById('recommendations-container');
                    container.innerHTML = `
                        <div class="recommendations-section">
                            <h2>🔥 Top Recommendations</h2>
                            ${data.recommendations.map(rec => {
                        const s = rec.suggestion;
                        const score = rec.quality_score.toFixed(1);
                        const sizeGB = (s.size / (1024 * 1024 * 1024)).toFixed(2);
                        return `
                                    <div class="recommendation-item">
                                        <div>
                                            <strong>${escapeHtml(s.title)}</strong>
                                            <span class="quality-badge ${getQualityClass(rec.quality_score)}">Score: ${score}/10</span>
                                            <div style="font-size: 12px; color: #999; margin-top: 5px;">
                                                ${s.seeders} seeders • ${sizeGB} GB
                                            </div>
                                        </div>
                                        <button onclick="showDetails(${s.id})" class="secondary">View</button>
                                    </div>
                                `;
                    }).join('')}
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Failed to load recommendations:', error);
            }
        }

        function getQualityClass(score) {
            if (score >= 8) return 'quality-excellent';
            if (score >= 6) return 'quality-good';
            if (score >= 4) return 'quality-fair';
            return 'quality-poor';
        }

        async function searchSuggestions() {
            const container = document.getElementById('suggestions-container');
            const searchQuery = document.getElementById('search-input').value;
            const status = document.getElementById('status-filter').value;
            const sortBy = document.getElementById('sort-by').value;
            const minSeeders = document.getElementById('min-seeders').value || 0;

            container.innerHTML = '<div class="loading">Searching...</div>';
            selectedIds.clear();
            updateBatchButtons();

            try {
                const offset = currentPage * pageSize;
                const params = new URLSearchParams({
                    q: searchQuery,
                    status: status,
                    sort_by: sortBy,
                    min_seeders: minSeeders,
                    limit: pageSize,
                    offset: offset
                });

                const response = await fetch(`${API_BASE}/suggestions/search?${params}`);
                const data = await response.json();

                if (!data.suggestions || data.suggestions.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <h2>No suggestions found</h2>
                            <p>Try adjusting your search filters</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = `
                    <div class="suggestions-list">
                        ${data.suggestions.map(renderSuggestion).join('')}
                    </div>
                `;

                renderPagination(data.total);
            } catch (error) {
                console.error('Failed to search suggestions:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <h2>Error searching suggestions</h2>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        function handleSearchKeyup(event) {
            if (event.key === 'Enter') {
                currentPage = 0;
                searchSuggestions();
            }
        }

        async function loadSuggestions() {
            document.getElementById('search-input').value = '';
            document.getElementById('min-seeders').value = '';

            const container = document.getElementById('suggestions-container');
            const status = document.getElementById('status-filter').value;

            container.innerHTML = '<div class="loading">Loading suggestions...</div>';
            selectedIds.clear();
            updateBatchButtons();

            try {
                const offset = currentPage * pageSize;
                const response = await fetch(
                    `${API_BASE}/suggestions?status=${status}&limit=${pageSize}&offset=${offset}`
                );
                const data = await response.json();

                if (!data.suggestions || data.suggestions.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <h2>No suggestions found</h2>
                            <p>Generate suggestions to get started</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = `
                    <div class="suggestions-list">
                        ${data.suggestions.map(renderSuggestion).join('')}
                    </div>
                `;

                renderPagination(data.total);
            } catch (error) {
                console.error('Failed to load suggestions:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <h2>Error loading suggestions</h2>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        function renderSuggestion(suggestion) {
            const sizeGB = (suggestion.size / (1024 * 1024 * 1024)).toFixed(2);
            const uploadDate = new Date(suggestion.upload_date).toLocaleDateString();

            return `
                <div id="suggestion-${suggestion.id}" class="suggestion-card ${selectedIds.has(suggestion.id) ? 'selected' : ''}">
                    <div class="checkbox-wrapper">
                        <input type="checkbox" 
                               ${selectedIds.has(suggestion.id) ? 'checked' : ''}
                               onchange="toggleSelection(${suggestion.id})">
                    </div>
                    <div class="suggestion-info" onclick="showDetails(${suggestion.id})" style="cursor: pointer;">
                        <div class="suggestion-title">${escapeHtml(suggestion.title)}</div>
                        <div class="suggestion-meta">
                            <div class="meta-item">
                                <span class="meta-label">Seeders:</span>
                                <span class="meta-value seeders">${suggestion.seeders}</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label">Size:</span>
                                <span class="meta-value size">${sizeGB} GB</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label">Uploaded:</span>
                                <span class="meta-value">${uploadDate}</span>
                            </div>
                            ${suggestion.category ? `
                            <div class="meta-item">
                                <span class="meta-label">Category:</span>
                                <span class="meta-value">${suggestion.category}</span>
                            </div>
                            ` : ''}
                            ${suggestion.quality ? `
                            <div class="meta-item">
                                <span class="meta-label">Quality:</span>
                                <span class="meta-value">${suggestion.quality}</span>
                            </div>
                            ` : ''}
                        </div>
                    </div>
                    <div class="suggestion-actions">
                        <button onclick="event.stopPropagation(); showDetails(${suggestion.id})" class="secondary">
                            Details
                        </button>
                        <button onclick="event.stopPropagation(); approveSuggestion(${suggestion.id})" class="success">
                            Approve
                        </button>
                        <button 
                            hx-post="${API_BASE}/suggestions/reject" 
                            hx-vals='{"id": ${suggestion.id}}'
                            hx-swap="outerHTML swap:0.3s"
                            hx-target="#suggestion-${suggestion.id}"
                            hx-on::after-request="loadStats(); loadRecommendations();"
                            class="danger"
                            onclick="event.stopPropagation()">
                            Reject
                        </button>
                    </div>
                </div>
            `;
        }

        async function showDetails(id) {
            try {
                const response = await fetch(`${API_BASE}/suggestions?status=&limit=1000&offset=0`);
                const data = await response.json();
                const suggestion = data.suggestions.find(s => s.id === id);

                if (!suggestion) {
                    alert('Suggestion not found');
                    return;
                }

                currentModalId = id;

                const scoreResponse = await fetch(`${API_BASE}/suggestions/quality-score?id=${id}`);
                const scoreData = await scoreResponse.json();
                const score = scoreData.quality_score.toFixed(1);

                document.getElementById('modal-detail-title').textContent = suggestion.title;
                document.getElementById('modal-seeders').textContent = suggestion.seeders;
                document.getElementById('modal-leechers').textContent = suggestion.leechers;
                document.getElementById('modal-size').textContent = (suggestion.size / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
                document.getElementById('modal-upload-date').textContent = new Date(suggestion.upload_date).toLocaleString();
                document.getElementById('modal-category').textContent = suggestion.category || 'N/A';
                document.getElementById('modal-quality').textContent = suggestion.quality || 'N/A';
                document.getElementById('modal-resolution').textContent = suggestion.resolution || 'N/A';
                document.getElementById('modal-quality-score').innerHTML = `<span class="quality-badge ${getQualityClass(parseFloat(score))}">${score}/10</span>`;
                document.getElementById('modal-info-hash').textContent = suggestion.info_hash;

                const magnetLink = document.getElementById('modal-magnet-link');
                magnetLink.href = suggestion.magnet_link;
                magnetLink.textContent = suggestion.magnet_link.substring(0, 100) + '...';
                magnetLink.onclick = (e) => {
                    e.preventDefault();
                    navigator.clipboard.writeText(suggestion.magnet_link);
                    alert('Magnet link copied to clipboard!');
                };

                if (suggestion.notes) {
                    document.getElementById('modal-notes-section').style.display = 'block';
                    document.getElementById('modal-notes').textContent = suggestion.notes;
                } else {
                    document.getElementById('modal-notes-section').style.display = 'none';
                }

                const isPending = suggestion.status === 'pending';
                document.getElementById('modal-approve-btn').style.display = isPending ? 'inline-block' : 'none';
                document.getElementById('modal-reject-btn').style.display = isPending ? 'inline-block' : 'none';

                document.getElementById('detail-modal').classList.add('active');
            } catch (error) {
                alert('Failed to load suggestion details: ' + error.message);
            }
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.remove('active');
            currentModalId = null;
        }

        async function approveFromModal() {
            if (currentModalId) {
                await approveSuggestion(currentModalId);
                closeModal();
            }
        }

        async function rejectFromModal() {
            if (currentModalId) {
                await rejectSuggestion(currentModalId);
                closeModal();
            }
        }

        function renderPagination(total) {
            const totalPages = Math.ceil(total / pageSize);
            const pagination = document.getElementById('pagination');

            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let html = '';
            if (currentPage > 0) {
                html += `<button onclick="changePage(${currentPage - 1})">Previous</button>`;
            }
            html += `<span style="color: #999; padding: 0 15px;">Page ${currentPage + 1} of ${totalPages}</span>`;
            if (currentPage < totalPages - 1) {
                html += `<button onclick="changePage(${currentPage + 1})">Next</button>`;
            }

            pagination.innerHTML = html;
        }

        function changePage(page) {
            currentPage = page;
            const searchQuery = document.getElementById('search-input').value;
            if (searchQuery) {
                searchSuggestions();
            } else {
                loadSuggestions();
            }
        }

        function toggleSelection(id) {
            if (selectedIds.has(id)) {
                selectedIds.delete(id);
            } else {
                selectedIds.add(id);
            }
            updateBatchButtons();
            const searchQuery = document.getElementById('search-input').value;
            if (searchQuery) {
                searchSuggestions();
            } else {
                loadSuggestions();
            }
        }

        function updateBatchButtons() {
            const hasSelection = selectedIds.size > 0;
            document.getElementById('bulk-approve').disabled = !hasSelection;
            document.getElementById('bulk-reject').disabled = !hasSelection;
        }

        async function approveSuggestion(id) {
            try {
                await fetch(`${API_BASE}/suggestions/approve`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id })
                });
                loadSuggestions();
                loadStats();
                loadRecommendations();
            } catch (error) {
                alert('Failed to approve suggestion: ' + error.message);
            }
        }

        async function rejectSuggestion(id) {
            try {
                await fetch(`${API_BASE}/suggestions/reject`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id })
                });
                loadSuggestions();
                loadStats();
                loadRecommendations();
            } catch (error) {
                alert('Failed to reject suggestion: ' + error.message);
            }
        }

        async function bulkApprove() {
            if (selectedIds.size === 0) return;

            try {
                await fetch(`${API_BASE}/suggestions/approve-batch`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ids: Array.from(selectedIds) })
                });
                selectedIds.clear();
                loadSuggestions();
                loadStats();
                loadRecommendations();
            } catch (error) {
                alert('Failed to approve suggestions: ' + error.message);
            }
        }

        async function bulkReject() {
            if (selectedIds.size === 0) return;

            try {
                await fetch(`${API_BASE}/suggestions/reject-batch`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ids: Array.from(selectedIds) })
                });
                selectedIds.clear();
                loadSuggestions();
                loadStats();
                loadRecommendations();
            } catch (error) {
                alert('Failed to reject suggestions: ' + error.message);
            }
        }

        async function generateSuggestions() {
            const ruleId = 1;

            if (!confirm('Generate new suggestions? This may take a few minutes.')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/suggestions/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rule_id: ruleId })
                });
                const data = await response.json();
                alert(`Generated ${data.created} new suggestions`);
                loadSuggestions();
                loadStats();
                loadRecommendations();
            } catch (error) {
                alert('Failed to generate suggestions: ' + error.message);
            }
        }

        async function clearRejected() {
            if (!confirm('Delete all rejected suggestions?')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/suggestions/clear-rejected`, {
                    method: 'POST'
                });
                const data = await response.json();
                alert(`Deleted ${data.deleted} rejected suggestions`);
                loadSuggestions();
                loadStats();
            } catch (error) {
                alert('Failed to clear rejected suggestions: ' + error.message);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize page
        loadFilterState();
        loadSuggestions();
        loadStats();
        loadRecommendations();
        setInterval(loadStats, 30000);
        setInterval(loadRecommendations, 60000);
    </script>
</body>

</html>
