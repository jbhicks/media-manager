project_name: media-manager
builds:
  - id: media-manager
    main: ./cmd/media-manager
    binary: media-manager
    goos:
      - windows
    goarch:
      - amd64
    ldflags:
      - -s -w -H=windowsgui  # Strip debug info and hide console window
  - id: media-manager-service
    main: ./cmd/media-manager-service
    binary: media-manager-service
    goos:
      - windows
    goarch:
      - amd64
    ldflags:
      - -s -w  # Strip debug info for smaller binaries
archives:
  - builds:
      - media-manager
      - media-manager-service
    format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
nfpms: []  # Skip Linux packages for now - focus on Windows installer
release:
  github:
    owner: jbhicks
    name: media-manager